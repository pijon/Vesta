<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF8F3" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Vesta - Warmth Health</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Theme Sync CSS */
    html.dark body,
    html.dark .initial-loader {
      background-color: #17181D !important;
    }

  </style>
  <script>
    // Immediate Theme Sync to prevent flash
    (function () {
      try {
        // App.tsx saves under vesta_darkMode (older installs still have fast800_darkMode)
        const saved = localStorage.getItem('vesta_darkMode') ?? localStorage.getItem('fast800_darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Default to system if no save, otherwise respect save
        if (saved === 'true' || (saved === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.warn('Theme sync failed', e);
      }
      // The "Market day" look, as this device last used it (utils/marketTheme.ts), with its fonts
      try {
        if (localStorage.getItem('vesta_marketTheme') === '1') {
          document.documentElement.classList.add('theme-market');
          var fonts = document.createElement('link');
          fonts.id = 'market-fonts';
          fonts.rel = 'stylesheet';
          fonts.href = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap';
          document.head.appendChild(fonts);
        }
      } catch (e) { /* the default look is fine */ }
    })();
  </script>

</head>

<body>
  <!-- The splash lives outside #root so React does not replace it on mount. It stays up
       until Firebase has restored the session; AuthGuard fades it out. -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FBF8F3;
      font-family: 'Figtree', sans-serif;
    }

    .initial-loader {
      --sp-bg: #FBF8F3;
      --sp-ink: #1F2430;
      --sp-muted: #5D6270;
      --sp-track: #ECE6DC;
      --sp-primary: #B94E36;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--sp-bg);
      z-index: 9999;
      font-family: 'Figtree', system-ui, sans-serif;
    }

    html.dark .initial-loader {
      --sp-bg: #17181D;
      --sp-ink: #F3EFE8;
      --sp-muted: #A3A7B3;
      --sp-track: #2F323C;
      --sp-primary: #E07A5F;
    }

    /* "Market day" splash: butter page, tomato track, Bricolage greeting and the new mark */
    html.theme-market .initial-loader {
      --sp-bg: #FFF1D6;
      --sp-ink: #1B1B1B;
      --sp-muted: #6B5A3A;
      --sp-track: #F1E3C4;
      --sp-primary: #FF5533;
    }

    html.theme-market.dark .initial-loader {
      --sp-bg: #1A1714;
      --sp-ink: #FFF1D6;
      --sp-muted: #BBAE96;
      --sp-track: #3A332A;
      --sp-primary: #FF6A4A;
    }

    html.theme-market.dark body,
    html.theme-market.dark .initial-loader {
      background-color: #1A1714 !important;
    }

    html.theme-market .splash-greeting {
      font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif;
      font-size: 26px;
      line-height: 32px;
      letter-spacing: -0.025em;
    }

    html.theme-market .loading-text {
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .splash-logo .splash-mark-market { display: none; }
    html.theme-market .splash-logo .splash-mark-market { display: block; }
    html.theme-market .splash-logo .splash-mark-classic { display: none; }

    .splash-logo {
      width: 104px;
      height: 104px;
      margin-bottom: 28px;
      animation: splashIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .splash-flame,
    .splash-core {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .splash-flame {
      animation: flicker 1.6s ease-in-out infinite;
    }

    .splash-core {
      animation: flicker 1.1s ease-in-out infinite reverse;
    }

    .splash-ember {
      opacity: 0;
      animation: ember 2.4s ease-out infinite;
    }

    .splash-ember:nth-of-type(2) { animation-delay: 0.8s; }
    .splash-ember:nth-of-type(3) { animation-delay: 1.6s; }

    .splash-greeting {
      margin: 0 0 6px;
      font-family: 'Nunito', 'Figtree', system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      line-height: 28px;
      letter-spacing: -0.01em;
      color: var(--sp-ink);
      animation: splashIn 0.5s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .loading-text {
      min-height: 20px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--sp-muted);
      transition: opacity 0.25s ease;
      animation: splashIn 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .loading-text.is-swapping {
      opacity: 0;
    }

    .splash-track {
      position: relative;
      width: 120px;
      height: 4px;
      margin-top: 20px;
      border-radius: 2px;
      overflow: hidden;
      background: var(--sp-track);
    }

    .splash-track::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      border-radius: 2px;
      background: var(--sp-primary);
      animation: slide 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes splashIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes flicker {
      0%, 100% { transform: scale(1, 1) skewX(0deg); }
      25% { transform: scale(0.96, 1.06) skewX(-2deg); }
      50% { transform: scale(1.03, 0.95) skewX(1.5deg); }
      75% { transform: scale(0.98, 1.04) skewX(-1deg); }
    }

    @keyframes ember {
      0% { opacity: 0; transform: translate(0, 0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--drift, 0px), -22px); }
    }

    @keyframes slide {
      from { left: -40%; }
      to { left: 100%; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .initial-loader.fade-out {
      animation: fadeOut 0.3s ease-out forwards;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo, .splash-greeting, .loading-text, .splash-flame, .splash-core, .splash-track::after {
        animation: none;
      }
      .splash-ember { display: none; }
      .splash-track::after { left: 30%; }
    }
  </style>
  <div id="initial-loader" class="initial-loader" role="status" aria-live="polite">
    <div class="splash-logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" class="splash-mark-market">
        <rect width="100" height="100" rx="30" fill="#FF5533"/>
        <circle class="splash-ember" cx="34" cy="30" r="2" fill="#FFF1D6" style="--drift: -4px"/>
        <circle class="splash-ember" cx="66" cy="26" r="1.6" fill="#FFF1D6" style="--drift: 4px"/>
        <circle class="splash-ember" cx="62" cy="36" r="1.8" fill="#FFF1D6" style="--drift: 6px"/>
        <path class="splash-flame" d="M50 13 C61 26 69 34 69 46 C69 55 61 60 50 60 C39 60 31 55 31 46 C31 38 35 33 41 27 C42 35 45 39 48 40 C46 31 47 22 50 13 Z" fill="#FFD23F"/>
        <path d="M19 55 H81 C81 74 67 85 50 85 C33 85 19 74 19 55 Z" fill="#FFF1D6"/>
      </svg>
      <svg viewBox="0 0 100 100" class="splash-mark-classic">
        <rect width="100" height="100" rx="22" fill="#B94E36"/>
        <circle class="splash-ember" cx="36" cy="34" r="1.8" fill="#F6C9A8" style="--drift: -4px"/>
        <circle class="splash-ember" cx="64" cy="30" r="1.4" fill="#F6C9A8" style="--drift: 4px"/>
        <circle class="splash-ember" cx="60" cy="38" r="1.6" fill="#F6C9A8" style="--drift: 6px"/>
        <path class="splash-flame" d="M50 10 C58 22 68 31 68 47 C68 59 60 66 50 66 C40 66 32 59 32 47 C32 39 36 34 41 28 C42 35 45 39 48 40 C46 30 47 20 50 10 Z" fill="#F6C9A8"/>
        <path class="splash-core" d="M50 38 C54 44 58 48 58 54 C58 60 54 64 50 64 C46 64 42 60 42 54 C42 48 46 44 50 38 Z" fill="#B94E36"/>
        <rect x="17" y="54" width="66" height="8" rx="4" fill="#FBF3E8" stroke="#B94E36" stroke-width="3"/>
        <path d="M23 62 H77 C77 75 65 83 50 83 C35 83 23 75 23 62 Z" fill="#FBF3E8"/>
        <rect x="39" y="84" width="22" height="5" rx="2.5" fill="#FBF3E8"/>
      </svg>
    </div>
    <h1 class="splash-greeting" id="splash-greeting">Vesta</h1>
    <div class="loading-text" id="splash-message">Warming the hearth…</div>
    <div class="splash-track" aria-hidden="true"></div>
  </div>
  <script>
    // Greet returning users by name (from the stats cache) and cycle a few short messages
    // until AuthGuard removes the splash.
    (function () {
      try {
        var stats = JSON.parse(localStorage.getItem('fast800_cache_stats') || 'null');
        var name = stats && typeof stats.name === 'string' ? stats.name.trim() : '';
        if (name) {
          var hour = new Date().getHours();
          var part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
          document.getElementById('splash-greeting').textContent = part + ', ' + name;
        }
      } catch (e) { /* the default greeting is fine */ }

      var messages = ['Warming the hearth…', 'Setting the table…', 'Checking the pantry…', 'Stirring the pot…', 'Gathering the family…'];
      var el = document.getElementById('splash-message');
      var i = 0;
      var timer = setInterval(function () {
        if (!el.isConnected) return clearInterval(timer);
        el.classList.add('is-swapping');
        setTimeout(function () {
          i = (i + 1) % messages.length;
          el.textContent = messages[i];
          el.classList.remove('is-swapping');
        }, 250);
      }, 1800);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
