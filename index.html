<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FBF8F3" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/masked-icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Vesta - Warmth Health</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Theme Sync CSS */
    html.dark body,
    html.dark .initial-loader {
      background-color: #17181D !important;
    }

    html.dark .loading-text {
      color: #F3EFE8 !important;
    }
  </style>
  <script>
    // Immediate Theme Sync to prevent flash
    (function () {
      try {
        const saved = localStorage.getItem('fast800_darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Default to system if no save, otherwise respect save
        if (saved === 'true' || (saved === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.warn('Theme sync failed', e);
      }
    })();
  </script>

</head>

<body>
  <div id="root">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #FBF8F3;
        font-family: 'Figtree', sans-serif;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FBF8F3;
        z-index: 9999;
      }

      .logo-pulse {
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .loading-text {
        font-family: 'Figtree', sans-serif;
        color: #1F2430;
        font-size: 1rem;
        font-weight: 700;
        opacity: 0.8;
        animation: fadeText 3s ease-in-out infinite;
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.8;
          transform: scale(0.95);
        }
      }

      @keyframes fadeText {

        0%,
        100% {
          opacity: 0.8;
        }

        50% {
          opacity: 0.4;
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      .initial-loader.fade-out {
        animation: fadeOut 0.3s ease-out forwards;
        pointer-events: none;
      }

      /* Dark mode support if user has system preference */
      /* Dark mode handled by html.dark class via script above */
    </style>
    <div id="initial-loader" class="initial-loader">
      <img src="/pwa-192x192.png" alt="Vesta" class="logo-pulse">
      <div class="loading-text">Warming the hearth…</div>
    </div>
  </div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
