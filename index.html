<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF1D6" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Vesta - Warmth Health</title>

  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Theme Sync CSS */
    html.dark body,
    html.dark .initial-loader {
      background-color: #1A1714 !important;
    }

  </style>
  <script>
    // Immediate Theme Sync to prevent flash
    (function () {
      try {
        // hooks/useTheme.ts saves 'light' or 'dark' under vesta_theme; no value follows the system
        const saved = localStorage.getItem('vesta_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.warn('Theme sync failed', e);
      }
    })();
  </script>

</head>

<body>
  <!-- The splash lives outside #root so React does not replace it on mount. It stays up
       until Firebase has restored the session; AuthGuard fades it out. -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF1D6;
      font-family: 'DM Sans Variable', system-ui, sans-serif;
    }

    .initial-loader {
      --sp-bg: #FFF1D6;
      --sp-ink: #1B1B1B;
      --sp-muted: #6B5A3A;
      --sp-track: #F1E3C4;
      --sp-primary: #FF5533;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--sp-bg);
      z-index: 9999;
      font-family: 'DM Sans Variable', system-ui, sans-serif;
    }

    html.dark .initial-loader {
      --sp-bg: #1A1714;
      --sp-ink: #FFF1D6;
      --sp-muted: #BBAE96;
      --sp-track: #3A332A;
      --sp-primary: #FF6A4A;
    }

    .splash-logo {
      width: 104px;
      height: 104px;
      margin-bottom: 28px;
      animation: splashIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .splash-flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flicker 1.6s ease-in-out infinite;
    }

    .splash-ember {
      opacity: 0;
      animation: ember 2.4s ease-out infinite;
    }

    .splash-ember:nth-of-type(2) { animation-delay: 0.8s; }
    .splash-ember:nth-of-type(3) { animation-delay: 1.6s; }

    .splash-greeting {
      margin: 0 0 6px;
      font-family: 'Bricolage Grotesque Variable', 'DM Sans Variable', system-ui, sans-serif;
      font-weight: 800;
      font-size: 26px;
      line-height: 32px;
      letter-spacing: -0.025em;
      color: var(--sp-ink);
      animation: splashIn 0.5s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .loading-text {
      min-height: 20px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--sp-muted);
      transition: opacity 0.25s ease;
      animation: splashIn 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .loading-text.is-swapping {
      opacity: 0;
    }

    .splash-track {
      position: relative;
      width: 120px;
      height: 4px;
      margin-top: 20px;
      border-radius: 2px;
      overflow: hidden;
      background: var(--sp-track);
    }

    .splash-track::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      border-radius: 2px;
      background: var(--sp-primary);
      animation: slide 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes splashIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes flicker {
      0%, 100% { transform: scale(1, 1) skewX(0deg); }
      25% { transform: scale(0.96, 1.06) skewX(-2deg); }
      50% { transform: scale(1.03, 0.95) skewX(1.5deg); }
      75% { transform: scale(0.98, 1.04) skewX(-1deg); }
    }

    @keyframes ember {
      0% { opacity: 0; transform: translate(0, 0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--drift, 0px), -22px); }
    }

    @keyframes slide {
      from { left: -40%; }
      to { left: 100%; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .initial-loader.fade-out {
      animation: fadeOut 0.3s ease-out forwards;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo, .splash-greeting, .loading-text, .splash-flame, .splash-track::after {
        animation: none;
      }
      .splash-ember { display: none; }
      .splash-track::after { left: 30%; }
    }
  </style>
  <div id="initial-loader" class="initial-loader" role="status" aria-live="polite">
    <div class="splash-logo" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <rect width="100" height="100" rx="30" fill="#FF5533"/>
        <circle class="splash-ember" cx="34" cy="30" r="2" fill="#FFF1D6" style="--drift: -4px"/>
        <circle class="splash-ember" cx="66" cy="26" r="1.6" fill="#FFF1D6" style="--drift: 4px"/>
        <circle class="splash-ember" cx="62" cy="36" r="1.8" fill="#FFF1D6" style="--drift: 6px"/>
        <path class="splash-flame" d="M50 13 C61 26 69 34 69 46 C69 55 61 60 50 60 C39 60 31 55 31 46 C31 38 35 33 41 27 C42 35 45 39 48 40 C46 31 47 22 50 13 Z" fill="#FFD23F"/>
        <path d="M19 55 H81 C81 74 67 85 50 85 C33 85 19 74 19 55 Z" fill="#FFF1D6"/>
      </svg>
    </div>
    <h1 class="splash-greeting" id="splash-greeting">Vesta</h1>
    <div class="loading-text" id="splash-message">Warming the hearth…</div>
    <div class="splash-track" aria-hidden="true"></div>
  </div>
  <script>
    // Greet returning users by name (from the stats cache) and cycle a few short messages
    // until AuthGuard removes the splash.
    (function () {
      try {
        var stats = JSON.parse(localStorage.getItem('fast800_cache_stats') || 'null');
        var name = stats && typeof stats.name === 'string' ? stats.name.trim() : '';
        if (name) {
          var hour = new Date().getHours();
          var part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
          document.getElementById('splash-greeting').textContent = part + ', ' + name;
        }
      } catch (e) { /* the default greeting is fine */ }

      var messages = ['Warming the hearth…', 'Setting the table…', 'Checking the pantry…', 'Stirring the pot…', 'Gathering the family…'];
      var el = document.getElementById('splash-message');
      var i = 0;
      var timer = setInterval(function () {
        if (!el.isConnected) return clearInterval(timer);
        el.classList.add('is-swapping');
        setTimeout(function () {
          i = (i + 1) % messages.length;
          el.textContent = messages[i];
          el.classList.remove('is-swapping');
        }, 250);
      }, 1800);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
